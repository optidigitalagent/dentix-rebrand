name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:pages
        env:
          VITE_DENTIX_CONTENT_API_URL: ${{ vars.VITE_DENTIX_CONTENT_API_URL }}
          VITE_DENTIX_CONTENT_TIMEOUT_MS: "4000"
          VITE_DENTIX_LEADS_API_URL: ${{ vars.VITE_DENTIX_LEADS_API_URL }}
          VITE_DENTIX_LEAD_TEST_MODE: "true"
          VITE_DENTIX_LEAD_CONTACT_METHODS: "PHONE,TELEGRAM,VIBER,WHATSAPP"
          VITE_DENTIX_BOOKING_API_URL: "https://dentix-app-production.up.railway.app/api/public/booking"
          VITE_DENTIX_BOOKING_ENABLED: "true"

      - name: Add GitHub Pages fallbacks
        run: |
          cp dist-pages/index.html dist-pages/404.html
          cp dist-pages/index.html dist-pages/price.html
          touch dist-pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger live deployment from main after GitHub Pages activation.
